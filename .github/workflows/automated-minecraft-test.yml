name: Automated Minecraft Test

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - functional-ab-test

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  MC_VERSION: "1.18.2"
  CREATE_FILE_ID: "5797603"

jobs:
  client-smoke:
    name: Forge client smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build release JAR
        run: python build.py

      - name: Validate built JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path("dist/create-crushing-recipe-fix-1.0.1.jar")
          if not jar.is_file():
              raise SystemExit(f"Missing built JAR: {jar}")

          with zipfile.ZipFile(jar) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt entry in JAR: {bad}")

          print(f"Validated {jar}")
          PY

      - name: Stage patch and Create
        run: |
          mkdir -p run/mods
          cp dist/create-crushing-recipe-fix-1.0.1.jar run/mods/
          curl --fail --location --retry 4 --retry-all-errors \
            "https://cursemaven.com/curse/maven/create-328085/${CREATE_FILE_ID}/create-328085-${CREATE_FILE_ID}.jar" \
            --output run/mods/create-1.18.2-0.5.1.i.jar
          test -s run/mods/create-1.18.2-0.5.1.i.jar

      - name: Run real Forge client
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: ${{ env.MC_VERSION }}
          modloader: forge
          regex: .*forge.*
          mc-runtime-test: lexforge
          java: ${{ env.JAVA_VERSION }}
          cache-mc: "github"

  recipe-ab:
    name: Recipe A/B - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control without patch
            expected_patch: "false"
            install_patch: "false"
          - name: patched
            expected_patch: "true"
            install_patch: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build release JAR
        run: python build.py

      - name: Build CI recipe assertion mod
        run: gradle -p ci/recipe-test-mod build --stacktrace

      - name: Validate CI helper JAR
        run: |
          HELPER="ci/recipe-test-mod/build/libs/create-crushing-recipe-ci-test-1.0.0.jar"
          test -s "$HELPER"
          jar tf "$HELPER" | grep -q 'io/github/zachsem/crushingtest/RecipeAssertionsMod.class'
          jar tf "$HELPER" | grep -q 'META-INF/mods.toml'
          unzip -p "$HELPER" META-INF/mods.toml | grep -q 'modId="create_crushing_recipe_ci_test"'

      - name: Stage test environment
        run: |
          mkdir -p run/mods
          rm -f run/ci-recipe-test-result.txt

          cp ci/recipe-test-mod/build/libs/create-crushing-recipe-ci-test-1.0.0.jar run/mods/

          curl --fail --location --retry 4 --retry-all-errors \
            "https://cursemaven.com/curse/maven/create-328085/${CREATE_FILE_ID}/create-328085-${CREATE_FILE_ID}.jar" \
            --output run/mods/create-1.18.2-0.5.1.i.jar

          if [ "${{ matrix.install_patch }}" = "true" ]; then
            cp dist/create-crushing-recipe-fix-1.0.1.jar run/mods/
          fi

          test -s run/mods/create-1.18.2-0.5.1.i.jar
          test -s run/mods/create-crushing-recipe-ci-test-1.0.0.jar
          ls -lh run/mods

      - name: Run real Forge dedicated server and assert recipes
        id: minecraft_server
        continue-on-error: true
        uses: headlesshq/mc-server-test@1.1.1
        with:
          mc: ${{ env.MC_VERSION }}
          modloader: forge
          java: ${{ env.JAVA_VERSION }}
          cache-mc: "true"
          headlessmc-command: >-
            --jvm "-DcreateCrushingRecipeFix.expected=${{ matrix.expected_patch }}
            -DcreateCrushingRecipeFix.resultFile=${{ github.workspace }}/run/ci-recipe-test-result.txt"

      - name: Verify runtime recipe assertions
        if: always()
        run: |
          set -euo pipefail
          echo "MC-Server-Test outcome: ${{ steps.minecraft_server.outcome }}"

          if [ ! -f run/ci-recipe-test-result.txt ]; then
            echo "The CI helper did not produce a runtime assertion result."
            exit 1
          fi

          cat run/ci-recipe-test-result.txt
          grep -q "^PASS expectedPatch=${{ matrix.expected_patch }}$" run/ci-recipe-test-result.txt

          for stone in asurine crimsite diorite ochrum tuff veridium; do
            if [ "${{ matrix.expected_patch }}" = "true" ]; then
              grep -q "^$stone: direct=false, recycling=true$" run/ci-recipe-test-result.txt
            else
              grep -q "^$stone: direct=true, recycling=true$" run/ci-recipe-test-result.txt
            fi
          done
