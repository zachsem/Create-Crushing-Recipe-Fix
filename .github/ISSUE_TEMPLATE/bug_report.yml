name: Bug report
description: Report a problem with Create Crushing Recipe Fix
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs triage"
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "1.18.2"
    validations:
      required: true
  - type: input
    id: forge
    attributes:
      label: Forge version
    validations:
      required: true
  - type: input
    id: create
    attributes:
      label: Create version
      placeholder: "0.5.1i"
    validations:
      required: true
  - type: input
    id: patch
    attributes:
      label: Create Crushing Recipe Fix version
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Single-player / integrated server
        - Dedicated server
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Where is the patch installed?
      options:
        - Client only
        - Server only
        - Both client and server
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach latest.log and, if applicable, the crash report.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other mods or datapacks
      description: List anything that changes Create recipes or datapack loading, if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for the same problem.
          required: true
